<rect x="1281" y="106" width="169" height="32" rx="16" fill="#f2f3f5" stroke="none" stroke-width="1"/>
<text x="1208" y="127" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700" fill="#4f5864" text-anchor="middle">Visão geral</text>
<text x="1365" y="127" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700" fill="#4f5864" text-anchor="middle">Como ler os sinais</text>
<text x="1142" y="183" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700" fill="#2458f5" text-anchor="start">← Visão geral</text>
<text x="1142" y="218" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="750" fill="#20242b" text-anchor="start">Nova análise</text>
<text x="1142" y="242" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="750" fill="#20242b" text-anchor="start">por texto</text>
<rect x="1138" y="264" width="314" height="475" rx="16" fill="#fff" stroke="#e4e7ed" stroke-width="1"/>
<text x="1154" y="295" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#20242b" text-anchor="start">Título da reunião</text>
<rect x="1154" y="305" width="282" height="42" rx="8" fill="#fff" stroke="#ccd2dc" stroke-width="1"/>
<text x="1168" y="332" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#838b96" text-anchor="start">Título</text>
<text x="1154" y="363" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#20242b" text-anchor="start">Empresa</text>
<rect x="1154" y="373" width="282" height="42" rx="8" fill="#fff" stroke="#ccd2dc" stroke-width="1"/>
