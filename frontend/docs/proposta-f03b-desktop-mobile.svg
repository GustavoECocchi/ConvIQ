<rect x="1138" y="755" width="314" height="84" rx="14" fill="#fff" stroke="#e4e7ed" stroke-width="1"/>
<text x="1154" y="784" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="750" fill="#20242b" text-anchor="start">Antes de começar</text>
<text x="1154" y="807" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="400" fill="#66707e" text-anchor="start">Cole a transcrição completa em texto.</text>
<text x="1154" y="824" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="400" fill="#66707e" text-anchor="start">Nenhuma análise será enviada ainda.</text>
